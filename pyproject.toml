[project]
name = "rominabox"
version = "0.1.0"
description = "Build a standalone home for a game."
requires-python = ">=3.11,<3.14"
dependencies = ["PySide6-Essentials>=6.8,<6.10", "pydantic>=2.10,<3", "Pillow>=11,<13"]

[project.scripts]
rominabox = "rominabox.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.11", "mypy>=1.15", "pyinstaller>=6.12,<7", "types-Pillow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
files = ["src/rominabox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["runtime: opt-in tests that launch RetroArch", "desktop: opt-in visible desktop tests"]
