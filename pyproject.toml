# The Python for the developer scripts and the tests, through uv:
# `uv run python scripts/<script>.py` (README). The builder and the exported
# player use no Python.
[project]
name = "rominabox"
version = "0.1.0"
description = "ROM-in-a-Box's developer scripts and tests."
requires-python = ">=3.13,<3.14"
dependencies = ["Pillow>=12,<13", "fonttools>=4.61,<5", "zstandard>=0.23,<1"]

[tool.uv]
package = false
