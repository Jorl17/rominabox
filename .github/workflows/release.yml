# We make releases only from version tags, v<version>.
#
# For each platform, we build the player and its runtime kit on that platform,
# then the builder from them. We then publish the installers as the version's
# release, and the kits as the release of their player commit
# (scripts/publish_kit.py), from which builders download them. When someone
# starts the workflow by hand (workflow_dispatch), we keep the results as
# workflow artifacts and publish nothing, and the run can be limited to one
# platform.
#
# On macOS we build three builders from one kit, each in a job of its own at
# the same time: for arm64 (ROM-in-a-Box-<version>-macos.zip, the default
# download), for Intel (-macos-intel.zip) and universal (-macos-universal.zip).
# The builder jobs start with the kit job and compile while it runs, then wait
# for the kit and bundle.
# The steps that every build job starts with are in .github/actions/setup.
#
# Secrets: FORK_DEPLOY_KEY is a read-only key for the private RetroArch fork.
# For the Mac builder's Developer ID signature and notarization, the secrets
# are MACOS_CERTIFICATE (the certificate and key as a base64 .p12),
# MACOS_CERTIFICATE_PASSWORD, and an App Store Connect API key: NOTARY_KEY (the
# .p8 file's text), NOTARY_KEY_ID and NOTARY_ISSUER. Without them, we sign the
# Mac builder ad hoc. TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD sign the update packages: the .app.tar.gz
# of each notarized Mac builder and the Windows installer. In a release, the
# builders read latest.json (scripts/update_manifest.py) to find the packages,
# and we publish no release without a signed package for every platform.
# The public key is in desktop/src-tauri/tauri.conf.json. To change the key,
# first publish a release whose tauri.conf.json has the new public key, signed
# with the old key, and sign with the new key only after it. Builders that
# never install that release cannot update again.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: Which platforms to build
        type: choice
        options: [both, macos, windows]
        default: both

permissions:
  contents: write
  # A Mac builder job looks in the run for the resources of the Mac kit.
  actions: read

jobs:
  windows:
    if: inputs.platforms != 'macos'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
        with:
          platform: windows
          fork-deploy-key: ${{ secrets.FORK_DEPLOY_KEY }}
      - uses: ./.github/actions/kit
      - name: Build the Windows builder
        run: |
          (cd desktop && npm ci)
          uv run python scripts/build_builder.py
          mkdir -p release/installers release/kits
          cp desktop/target/release/bundle/nsis/*-setup.exe release/installers/
          cp work/kits/*.zip release/kits/
          ls -la release/installers release/kits
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          path: release/
          if-no-files-found: error

  # The Mac player and kit, once for the three Mac builders. We pass the
  # builder's resources on as a tar file, which keeps the executable bits that
  # an artifact loses.
  macos-kit:
    if: inputs.platforms != 'windows'
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
        with:
          platform: macos
          fork-deploy-key: ${{ secrets.FORK_DEPLOY_KEY }}
      - uses: ./.github/actions/kit
      - name: Collect the kit and the builder's resources
        run: |
          mkdir -p release/kits
          cp work/kits/*.zip release/kits/
          tar -czf "$RUNNER_TEMP/builder-resources.tar.gz" -C desktop/src-tauri resources
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos-kit
          path: release/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: builder-resources-macos
          path: ${{ runner.temp }}/builder-resources.tar.gz
          if-no-files-found: error
          retention-days: 1

  macos-builder:
    if: inputs.platforms != 'windows'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: arm64, triple: aarch64-apple-darwin, processors: "arm64", file: macos, key: darwin-aarch64 }
          - { variant: x86_64, triple: x86_64-apple-darwin, processors: "x86_64", file: macos-intel, key: darwin-x86_64 }
          - { variant: universal, triple: universal-apple-darwin, processors: "arm64 x86_64", file: macos-universal, key: darwin-universal }
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Each secret goes only to the steps that use it. The later steps test
      # these outputs instead of the secrets.
      - name: Check which Apple secrets are set
        id: signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          echo "apple=$([ -n "$MACOS_CERTIFICATE" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "notarize=$([ -n "$MACOS_CERTIFICATE" ] && [ -n "$NOTARY_KEY" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup
        with:
          platform: macos
          fork-deploy-key: ${{ secrets.FORK_DEPLOY_KEY }}
      - name: Compile the ${{ matrix.variant }} builder while the kit is built
        run: |
          (cd desktop && npm ci)
          uv run python scripts/build_builder.py --compile-only --mac "${{ matrix.variant }}"
      - name: Wait for the resources of the Mac kit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 120); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].name' | grep -qx builder-resources-macos; then
              exit 0
            fi
            ended=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | select(.name == "macos-kit") | .conclusion')
            if [ -n "$ended" ] && [ "$ended" != success ]; then
              echo "The Mac kit job ended with $ended."
              exit 1
            fi
            sleep 15
          done
          echo "The resources of the Mac kit were not there after 30 minutes."
          exit 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: builder-resources-macos
          path: ${{ runner.temp }}
      - name: Put the kit's resources in place
        run: tar -xzf "$RUNNER_TEMP/builder-resources.tar.gz" -C desktop/src-tauri

      - name: Import the Developer ID certificate
        if: steps.signing.outputs.apple == 'yes'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p release "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p release "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k release "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          test -n "$identity" || { echo "MACOS_CERTIFICATE contains no Developer ID Application certificate"; exit 1; }
          echo "ROMINABOX_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build, check and notarize the ${{ matrix.variant }} builder
        env:
          NOTARIZE: ${{ steps.signing.outputs.notarize }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          (cd desktop && npm ci)
          version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          mkdir -p release/installers
          uv run python scripts/build_builder.py --mac "${{ matrix.variant }}"
          app="desktop/target/${{ matrix.triple }}/release/bundle/macos/ROM-in-a-Box.app"
          for program in "$app"/Contents/MacOS/* "$app/Contents/Resources/bin/rominabox-cli" "$app/Contents/Resources/preview/rml-preview"; do
            held=$(lipo -archs "$program" | tr ' ' '\n' | sort | xargs)
            test "$held" = "${{ matrix.processors }}" || { echo "$program holds $held, not ${{ matrix.processors }}"; exit 1; }
          done
          if [ "$NOTARIZE" = yes ]; then
            echo "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
            ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
            xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --wait
            xcrun stapler staple "$app"
            # The update package, only of a notarized builder, without the
            # extended attributes and resource forks of macOS.
            package=$(uv run python scripts/update_manifest.py package "${{ matrix.key }}" "$version")
            COPYFILE_DISABLE=1 tar --no-mac-metadata -czf "release/installers/$package" -C "$(dirname "$app")" "$(basename "$app")"
          fi
          ditto -c -k --keepParent "$app" "release/installers/ROM-in-a-Box-${version}-${{ matrix.file }}.zip"
          ls -la release/installers
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos-${{ matrix.variant }}
          path: release/
          if-no-files-found: error

  # The signatures that a builder checks before it installs an update, each
  # with the version of the package in it, so that a manifest cannot offer an
  # older package as a newer version. In a job of its own after the builds,
  # so that only its signing step gets the key, and so that a failure here
  # runs again without the builds. We run the Tauri command line that npm ci
  # installs from package-lock.json, never one that npx could fetch.
  sign:
    needs: [windows, macos-builder]
    # A run by hand for one platform skips the other platform's jobs.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Install the Tauri command line
        run: cd desktop && npm ci
      - name: Sign the update packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not set, so we sign no update package."
            exit 0
          fi
          shopt -s nullglob
          version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          for package in release/installers/*.app.tar.gz release/installers/*-setup.exe; do
            desktop/node_modules/.bin/tauri signer sign --app-version "$version" "$package" > /dev/null
            echo "signed $package"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-signed
          path: release/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: sign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-signed
          path: release
      - name: Publish the version's release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kit=$(ls release/kits | head -1 | sed -E 's/^[a-z]+-([0-9a-f]+)\.zip$/kit-\1/')
          setup=$(cd release/installers && ls *-setup.exe)
          version=${GITHUB_REF_NAME#v}
          {
            echo "ROM-in-a-Box $version for macOS and Windows."
            echo
            echo "- \`ROM-in-a-Box-$version-macos.zip\`: for Macs with Apple silicon."
            echo "- \`ROM-in-a-Box-$version-macos-intel.zip\`: for Intel Macs."
            echo "- \`ROM-in-a-Box-$version-macos-universal.zip\`: for both kinds of Mac."
            echo "- \`$setup\`: the installer for Windows."
            echo
            echo "The Windows installer is not signed with a code-signing certificate, so Microsoft Defender SmartScreen may warn that it comes from an unknown publisher and call it dangerous. It is safe to run: choose **More info**, then **Run anyway**."
            echo
            echo "Games for the other platform are made from the runtime kit of that platform in the release \`$kit\`, which is downloaded on first use."
            echo
            echo "Each file is also attached under a name without the version, so that a link to releases/latest/download/ always reaches the newest one."
          } > "$RUNNER_TEMP/notes.md"
          # The same files without the version in their names, for links to the
          # latest release.
          latest="$RUNNER_TEMP/latest"
          mkdir -p "$latest"
          for variant in macos macos-intel macos-universal; do
            cp "release/installers/ROM-in-a-Box-$version-$variant.zip" "$latest/ROM-in-a-Box-$variant.zip"
          done
          cp "release/installers/$setup" "$latest/ROM-in-a-Box-windows-setup.exe"
          # The update manifest, which refuses a release without a signed
          # package for every platform.
          uv run python scripts/update_manifest.py write "$version" release/installers "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # The version's release is the latest, which releases/latest/download/
          # links reach. Kit releases are never the latest (publish_kit.py).
          gh release create "$GITHUB_REF_NAME" release/installers/* "$latest"/* --verify-tag --latest \
            --title "ROM-in-a-Box $version" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Publish the kits in the player commit's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/publish_kit.py upload release/kits/*.zip
