# We make releases only from version tags, v<version>.
#
# For each platform, we build the player, its runtime kit and the builder on
# that platform. We then publish the installers as the version's release, and
# the kits as the release of their player commit (scripts/publish_kit.py),
# from which builders download them. When someone starts the workflow by hand
# (workflow_dispatch), we keep the results as workflow artifacts and publish
# nothing, and the run can be limited to one platform.
#
# On macOS we build three builders: for arm64 (ROM-in-a-Box-<version>-macos.zip,
# the default download), for Intel (-macos-intel.zip) and universal
# (-macos-universal.zip).
#
# Secrets: FORK_DEPLOY_KEY is a read-only key for the private RetroArch fork.
# For the Mac builder's Developer ID signature and notarization, the secrets
# are MACOS_CERTIFICATE (the certificate and key as a base64 .p12),
# MACOS_CERTIFICATE_PASSWORD, and an App Store Connect API key: NOTARY_KEY (the
# .p8 file's text), NOTARY_KEY_ID and NOTARY_ISSUER. Without them, we sign the
# Mac builder ad hoc.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: Which platforms to build
        type: choice
        options: [both, macos, windows]
        default: both

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms == 'macos' && '[{"runner":"macos-latest","platform":"macos"}]' || (inputs.platforms == 'windows' && '[{"runner":"windows-latest","platform":"windows"}]' || '[{"runner":"windows-latest","platform":"windows"},{"runner":"macos-latest","platform":"macos"}]')) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the builder's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} does not match version v${version}"; exit 1; }

      - name: Load the fork's deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.FORK_DEPLOY_KEY }}
      - name: Check out the RetroArch fork
        run: |
          git config --global url."git@github.com:Jorl17/rominabox-retroarch.git".insteadOf "https://github.com/Jorl17/rominabox-retroarch.git"
          git submodule update --init --depth 1 vendor/retroarch

      - name: Install MSYS2's UCRT64 toolchain
        if: matrix.platform == 'windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-tools
      - name: Point the build at the MSYS2 installation
        if: matrix.platform == 'windows'
        run: echo "ROMINABOX_MSYS2=$(cygpath -w '${{ steps.msys2.outputs.msys2-location }}')" >> "$GITHUB_ENV"

      - name: Install CMake, Ninja and pkg-config
        if: matrix.platform == 'macos'
        run: brew install cmake ninja pkgconf

      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Build the player and its runtime kit
        run: |
          target=$(uv run python -c 'import sys; sys.path.insert(0, "scripts"); import core_source, native_build; print(native_build.kit_target(core_source.host_target()))')
          uv run python scripts/build_player.py --target "$target" "$GITHUB_WORKSPACE/work/player"
          uv run python scripts/build_kit.py "$GITHUB_WORKSPACE/work/player"
          uv run python scripts/publish_kit.py pack

      - name: Import the Developer ID certificate
        if: matrix.platform == 'macos' && env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p release "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p release "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k release "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          test -n "$identity" || { echo "MACOS_CERTIFICATE contains no Developer ID Application certificate"; exit 1; }
          echo "ROMINABOX_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build the Windows builder
        if: matrix.platform == 'windows'
        run: |
          (cd desktop && npm ci)
          uv run python scripts/build_builder.py
          mkdir -p release/installers
          cp desktop/target/release/bundle/nsis/*-setup.exe release/installers/

      - name: Build, check and notarize the three Mac builders
        if: matrix.platform == 'macos'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          (cd desktop && npm ci)
          version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          mkdir -p release/installers
          for variant in arm64 x86_64 universal; do
            case $variant in
              arm64) triple=aarch64-apple-darwin; wanted="arm64"; name="ROM-in-a-Box-${version}-macos.zip" ;;
              x86_64) triple=x86_64-apple-darwin; wanted="x86_64"; name="ROM-in-a-Box-${version}-macos-intel.zip" ;;
              universal) triple=universal-apple-darwin; wanted="arm64 x86_64"; name="ROM-in-a-Box-${version}-macos-universal.zip" ;;
            esac
            uv run python scripts/build_builder.py --mac "$variant"
            app="desktop/target/$triple/release/bundle/macos/ROM-in-a-Box.app"
            for program in "$app"/Contents/MacOS/* "$app/Contents/Resources/bin/rominabox-cli" "$app/Contents/Resources/preview/rml-preview"; do
              held=$(lipo -archs "$program" | tr ' ' '\n' | sort | xargs)
              test "$held" = "$wanted" || { echo "$program holds $held, not $wanted"; exit 1; }
            done
            if [ -n "$MACOS_CERTIFICATE" ] && [ -n "$NOTARY_KEY" ]; then
              echo "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
              ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
              xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$RUNNER_TEMP/notary.p8" \
                --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --wait
              xcrun stapler staple "$app"
            fi
            ditto -c -k --keepParent "$app" "release/installers/$name"
          done

      - name: Collect the release files
        run: |
          mkdir -p release/kits
          cp work/kits/*.zip release/kits/
          ls -la release/installers release/kits
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Publish the version's release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kit=$(ls release/kits | head -1 | sed -E 's/^[a-z]+-([0-9a-f]+)\.zip$/kit-\1/')
          version=${GITHUB_REF_NAME#v}
          {
            echo "ROM-in-a-Box $version for macOS and Windows."
            echo
            echo "- \`ROM-in-a-Box-$version-macos.zip\`: for Macs with Apple silicon."
            echo "- \`ROM-in-a-Box-$version-macos-intel.zip\`: for Intel Macs."
            echo "- \`ROM-in-a-Box-$version-macos-universal.zip\`: for both kinds of Mac."
            echo "- The \`-setup.exe\` file: the installer for Windows."
            echo
            echo "To make games for the other platform, the builder downloads the runtime kit of that platform from the release \`$kit\`."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" release/installers/* --verify-tag \
            --title "ROM-in-a-Box $version" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Publish the kits in the player commit's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/publish_kit.py upload release/kits/*.zip
