# We make releases only from version tags, v<version>.
#
# For each platform, we build the player and its runtime kit on that platform
# (the kit job), then the builder from them (the builder job). We then publish
# the installers as the version's release, and the kits as the release of their
# player commit (scripts/publish_kit.py), from which builders download them.
# When someone starts the workflow by hand (workflow_dispatch), we keep the
# results as workflow artifacts and publish nothing, and the run can be limited
# to one platform.
#
# A builder job starts with the kit job of its platform and compiles while the
# kit is built, then waits for the kit and bundles. On macOS we build three
# builders from one kit: for arm64 (ROM-in-a-Box-<version>-macos.zip, the
# default download) and for Intel (-macos-intel.zip) in builder jobs of their
# own, and the universal builder (-macos-universal.zip) by joining those two,
# without compiling again. The steps that the jobs share are in
# .github/actions.
#
# Secrets: FORK_DEPLOY_KEY is a read-only key for the private RetroArch fork.
# For the Mac builder's Developer ID signature and notarization, the secrets
# are MACOS_CERTIFICATE (the certificate and key as a base64 .p12),
# MACOS_CERTIFICATE_PASSWORD, and an App Store Connect API key: NOTARY_KEY (the
# .p8 file's text), NOTARY_KEY_ID and NOTARY_ISSUER. Without them, we sign the
# Mac builder ad hoc. TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD sign the update packages: the .app.tar.gz
# of each notarized Mac builder and the Windows installer. In a release, the
# builders read latest.json (scripts/update_manifest.py) to find the packages,
# and we publish no release without a signed package for every platform.
# The public key is in desktop/src-tauri/tauri.conf.json. To change the key,
# first publish a release whose tauri.conf.json has the new public key, signed
# with the old key, and sign with the new key only after it. Builders that
# never install that release cannot update again.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: Which platforms to build
        type: choice
        options: [both, macos, windows]
        default: both

permissions:
  contents: write
  # A job waits in the run for artifacts of another (.github/actions/wait-for-artifacts).
  actions: read

jobs:
  kit:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms == 'macos' && '[{"platform":"macos","runner":"macos-latest"}]' || (inputs.platforms == 'windows' && '[{"platform":"windows","runner":"windows-latest"}]' || '[{"platform":"windows","runner":"windows-latest"},{"platform":"macos","runner":"macos-latest"}]')) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
        with:
          platform: ${{ matrix.platform }}
          fork-deploy-key: ${{ secrets.FORK_DEPLOY_KEY }}
      - uses: ./.github/actions/kit
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ matrix.platform }}-kit
          path: release/
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: builder-resources-${{ matrix.platform }}
          path: work/builder-resources.tar.gz
          if-no-files-found: error
          retention-days: 1

  builder:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms == 'macos' && '[{"platform":"macos","runner":"macos-latest","variant":"arm64","triple":"aarch64-apple-darwin","file":"macos","key":"darwin-aarch64"},{"platform":"macos","runner":"macos-latest","variant":"x86_64","triple":"x86_64-apple-darwin","file":"macos-intel","key":"darwin-x86_64"}]' || (inputs.platforms == 'windows' && '[{"platform":"windows","runner":"windows-latest","variant":"x86_64"}]' || '[{"platform":"windows","runner":"windows-latest","variant":"x86_64"},{"platform":"macos","runner":"macos-latest","variant":"arm64","triple":"aarch64-apple-darwin","file":"macos","key":"darwin-aarch64"},{"platform":"macos","runner":"macos-latest","variant":"x86_64","triple":"x86_64-apple-darwin","file":"macos-intel","key":"darwin-x86_64"}]')) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      # The processors of a Mac builder, for scripts/build_builder.py.
      MAC_PROCESSORS: ${{ matrix.platform == 'macos' && format('--mac {0}', matrix.variant) || '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
        with:
          platform: ${{ matrix.platform }}
          fork-deploy-key: ${{ secrets.FORK_DEPLOY_KEY }}
      - name: Compile the builder while the kit is built
        run: |
          (cd desktop && npm ci)
          uv run python scripts/build_builder.py --compile-only $MAC_PROCESSORS
      - uses: ./.github/actions/wait-for-artifacts
        with:
          artifacts: builder-resources-${{ matrix.platform }}
          jobs: kit (${{ matrix.platform }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: builder-resources-${{ matrix.platform }}
          path: work
      - name: Put the kit's resources in place
        run: tar -xzf work/builder-resources.tar.gz -C desktop/src-tauri
      - uses: ./.github/actions/developer-id
        if: matrix.platform == 'macos'
        with:
          certificate: ${{ secrets.MACOS_CERTIFICATE }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          notary-key: ${{ secrets.NOTARY_KEY }}
      - name: Build the builder
        run: |
          uv run python scripts/build_builder.py $MAC_PROCESSORS
          mkdir -p release/installers
      - name: Collect the Windows installer
        if: matrix.platform == 'windows'
        run: cp desktop/target/release/bundle/nsis/*-setup.exe release/installers/
      - name: Check the ${{ matrix.variant }} builder and keep it for the universal builder
        if: matrix.platform == 'macos'
        run: |
          app="desktop/target/${{ matrix.triple }}/release/bundle/macos/ROM-in-a-Box.app"
          uv run python scripts/mac_release.py check "$app" "${{ matrix.variant }}"
          echo "BUILDER_APP=$app" >> "$GITHUB_ENV"
          # The signed builder before notarization, from which we make the
          # universal builder.
          tar -czf "work/builder-${{ matrix.variant }}.tar.gz" -C "$(dirname "$app")" "$(basename "$app")"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: matrix.platform == 'macos'
        with:
          name: mac-builder-${{ matrix.variant }}
          path: work/builder-${{ matrix.variant }}.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Notarize and pack the ${{ matrix.variant }} builder
        if: matrix.platform == 'macos'
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          uv run python scripts/mac_release.py pack "$BUILDER_APP" "${{ matrix.file }}" "${{ matrix.key }}" "$version" release/installers
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ matrix.platform }}-${{ matrix.variant }}
          path: release/
          if-no-files-found: error

  # The universal builder, made from the arm64 and Intel builders without
  # compiling again, as Tauri makes one: we join the two slices of each
  # program and sign the result (scripts/build_builder.py --merge-universal).
  # It starts with the other jobs and waits for those two builders, not for
  # the Windows builder.
  macos-universal:
    if: inputs.platforms != 'windows'
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: ./.github/actions/wait-for-artifacts
        with:
          artifacts: mac-builder-arm64 mac-builder-x86_64
          jobs: builder (macos
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: mac-builder-*
          path: work
          merge-multiple: true
      - uses: ./.github/actions/developer-id
        with:
          certificate: ${{ secrets.MACOS_CERTIFICATE }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          notary-key: ${{ secrets.NOTARY_KEY }}
      - name: Join the arm64 and Intel builders into the universal builder
        run: |
          for variant in arm64 x86_64; do
            mkdir -p "work/$variant"
            tar -xzf "work/builder-$variant.tar.gz" -C "work/$variant"
          done
          app="work/universal/ROM-in-a-Box.app"
          uv run python scripts/build_builder.py --merge-universal \
            work/arm64/ROM-in-a-Box.app work/x86_64/ROM-in-a-Box.app "$app"
          uv run python scripts/mac_release.py check "$app" arm64 x86_64
          echo "BUILDER_APP=$app" >> "$GITHUB_ENV"
      - name: Notarize and pack the universal builder
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          version=$(uv run python -c "import json; print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")
          uv run python scripts/mac_release.py pack "$BUILDER_APP" macos-universal darwin-universal "$version" release/installers
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-macos-universal
          path: release/
          if-no-files-found: error

  # The signatures that a builder checks before it installs an update, each
  # with the version of the package in it, so that a manifest cannot offer an
  # older package as a newer version. In a job of its own after the builds,
  # so that only its signing step gets the key, and so that a failure here
  # runs again without the builds. We run the Tauri command line that npm ci
  # installs from package-lock.json, never one that npx could fetch.
  sign:
    needs: [kit, builder, macos-universal]
    # A run by hand for one platform skips the other platform's jobs.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Install the Tauri command line
        run: cd desktop && npm ci
      - name: Sign the update packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not set, so we sign no update package."
            exit 0
          fi
          shopt -s nullglob
          version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          for package in release/installers/*.app.tar.gz release/installers/*-setup.exe; do
            desktop/node_modules/.bin/tauri signer sign --app-version "$version" "$package" > /dev/null
            echo "signed $package"
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-signed
          path: release/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: sign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-signed
          path: release
      - name: Publish the version's release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kit=$(ls release/kits | head -1 | sed -E 's/^[a-z]+-([0-9a-f]+)\.zip$/kit-\1/')
          setup=$(cd release/installers && ls *-setup.exe)
          version=${GITHUB_REF_NAME#v}
          {
            echo "ROM-in-a-Box $version for macOS and Windows."
            echo
            echo "- \`ROM-in-a-Box-$version-macos.zip\`: for Macs with Apple silicon."
            echo "- \`ROM-in-a-Box-$version-macos-intel.zip\`: for Intel Macs."
            echo "- \`ROM-in-a-Box-$version-macos-universal.zip\`: for both kinds of Mac."
            echo "- \`$setup\`: the installer for Windows."
            echo
            echo "The Windows installer is not signed with a code-signing certificate, so Microsoft Defender SmartScreen may warn that it comes from an unknown publisher and call it dangerous. It is safe to run: choose **More info**, then **Run anyway**."
            echo
            echo "Games for the other platform are made from the runtime kit of that platform in the release \`$kit\`, which is downloaded on first use."
            echo
            echo "Each file is also attached under a name without the version, so that a link to releases/latest/download/ always reaches the newest one."
          } > "$RUNNER_TEMP/notes.md"
          # The same files without the version in their names, for links to the
          # latest release.
          latest="$RUNNER_TEMP/latest"
          mkdir -p "$latest"
          for variant in macos macos-intel macos-universal; do
            cp "release/installers/ROM-in-a-Box-$version-$variant.zip" "$latest/ROM-in-a-Box-$variant.zip"
          done
          cp "release/installers/$setup" "$latest/ROM-in-a-Box-windows-setup.exe"
          # The update manifest, which refuses a release without a signed
          # package for every platform.
          uv run python scripts/update_manifest.py write "$version" release/installers "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # The version's release is the latest, which releases/latest/download/
          # links reach. Kit releases are never the latest (publish_kit.py).
          gh release create "$GITHUB_REF_NAME" release/installers/* "$latest"/* --verify-tag --latest \
            --title "ROM-in-a-Box $version" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Publish the kits in the player commit's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/publish_kit.py upload release/kits/*.zip
