# What every build job of the release workflow does first: check that a tag
# matches the builder's version, check out the private RetroArch fork, and
# install the tools of the platform. The repository is checked out already.
name: Set up a release build
description: Check the tag, check out the RetroArch fork and install the tools of the platform.
inputs:
  platform:
    description: macos or windows
    required: true
  fork-deploy-key:
    description: The read-only key for the private RetroArch fork
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 24
    - name: Check that the tag matches the builder's version
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: |
        version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
        test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} does not match version v${version}"; exit 1; }

    - name: Load the fork's deploy key
      uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
      with:
        ssh-private-key: ${{ inputs.fork-deploy-key }}
    - name: Check out the RetroArch fork
      shell: bash
      run: |
        git config --global url."git@github.com:Jorl17/rominabox-retroarch.git".insteadOf "https://github.com/Jorl17/rominabox-retroarch.git"
        git submodule update --init --depth 1 vendor/retroarch

    - name: Install MSYS2's UCRT64 toolchain
      if: inputs.platform == 'windows'
      id: msys2
      uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          make
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-make
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-pkgconf
          mingw-w64-ucrt-x86_64-librsvg
          mingw-w64-ucrt-x86_64-tools
    - name: Point the build at the MSYS2 installation
      if: inputs.platform == 'windows'
      shell: bash
      run: echo "ROMINABOX_MSYS2=$(cygpath -w '${{ steps.msys2.outputs.msys2-location }}')" >> "$GITHUB_ENV"

    # The runner has no graphics card, and Windows alone offers OpenGL 1.1, so
    # we draw the pictures of the builder's Menu step with Mesa's software
    # OpenGL (scripts/build_kit.py).
    - name: Install Mesa's software OpenGL
      if: inputs.platform == 'windows'
      shell: bash
      run: |
        curl -fsSL -o "$RUNNER_TEMP/mesa.7z" https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z
        echo "351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695  $RUNNER_TEMP/mesa.7z" | sha256sum --check
        7z e "$RUNNER_TEMP/mesa.7z" -o"$RUNNER_TEMP/mesa" x64/opengl32.dll x64/libgallium_wgl.dll
        echo "ROMINABOX_OPENGL_LIBRARIES=$(cygpath -w "$RUNNER_TEMP/mesa")" >> "$GITHUB_ENV"
        echo "GALLIUM_DRIVER=llvmpipe" >> "$GITHUB_ENV"

    - name: Install CMake, Ninja and pkg-config
      if: inputs.platform == 'macos'
      shell: bash
      run: brew install cmake ninja pkgconf

    - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
    - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      with:
        targets: ${{ inputs.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
