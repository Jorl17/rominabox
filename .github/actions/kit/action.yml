# The player and its runtime kit for the platform of the runner, after
# .github/actions/setup. We leave the kit packed for publishing in
# release/kits, and the builder's resources in
# work/builder-resources.tar.gz, as a tar file, which keeps the
# executable bits that an artifact loses.
name: Build the player and its runtime kit
description: Build the player for this platform and its runtime kit, and collect them for the release and the builder.
runs:
  using: composite
  steps:
    - name: Build the player and its runtime kit
      shell: bash
      run: |
        target=$(uv run python -c 'import sys; sys.path.insert(0, "scripts"); import core_source, native_build; print(native_build.kit_target(core_source.host_target()))')
        uv run python scripts/build_player.py --target "$target" "$GITHUB_WORKSPACE/work/player"
        uv run python scripts/build_kit.py "$GITHUB_WORKSPACE/work/player"
        uv run python scripts/publish_kit.py pack
    - name: Collect the kit and the builder's resources
      shell: bash
      run: |
        mkdir -p release/kits
        cp work/kits/*.zip release/kits/
        tar -czf work/builder-resources.tar.gz -C desktop/src-tauri resources
