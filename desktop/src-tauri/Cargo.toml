[package]
name = "rominabox-desktop"
version = "0.1.0"
description = "ROM-in-a-Box desktop shell"
edition = "2021"
default-run = "rominabox-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
chd = "0.3"
crc32fast = "1.5"
datary = "0.3"
md-5 = "0.11"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# For reading a controller in the builder's "press on controller" (src/pads.rs).
gilrs = "0.11"
sha1 = "0.11"
sha2 = "0.10"
ureq = "2.12"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
icns = { version = "0.4", default-features = false, features = ["pngio"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
libc = "0.2.189"
rominabox-scratch = { path = "../crates/rominabox-scratch" }
