[package]
name = "rominabox-desktop"
version = "0.4.2"
description = "ROM-in-a-Box desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rominabox-engine = { path = "../crates/rominabox-engine" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
image.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
# The small icon of the builder window, loaded at the size shown on the screen.
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
