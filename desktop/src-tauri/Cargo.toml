[package]
name = "rominabox-desktop"
version = "0.6.0"
description = "ROM-in-a-Box desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rominabox-engine = { path = "../crates/rominabox-engine" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Without zip, because the Windows package is the installer itself.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
image.workspace = true
serde_json.workspace = true

[dev-dependencies]
# A builder with no window, and a key and signatures made in the update tests.
tauri = { version = "2", features = ["test"] }
minisign = "0.7"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
# The small icon of the builder window, loaded at the size shown on the screen.
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
