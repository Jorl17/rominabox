[package]
name = "rominabox-engine"
version = "0.2.0"
description = "ROM-in-a-Box's authoring engine, shared by the builder and its command line"
homepage = "https://www.rominabox.app"
repository = "https://github.com/Jorl17/rominabox"
edition = "2021"

[dependencies]
chd = "0.3"
crc32fast = "1.5"
datary = "0.3"
# The per-user folders for the builder's caches, for the command line. In the
# builder we find them through Tauri's path resolver, built on the same crate.
dirs = "6"
# Canonical paths without Windows' verbatim \\?\ prefix whenever the ordinary form
# is the same path, so the paths we show read as the author wrote them.
dunce = "1.0"
md-5 = "0.11"
# For mapping a game and the patched game from disk, so that when we patch a
# disc, only the patched parts are in memory (src/patching.rs). MIT or Apache-2.0.
memmap2 = "0.9"
image.workspace = true
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
# For reading a controller in the builder's "press on controller" (src/pads.rs).
gilrs = "0.11"
sha1 = "0.11"
sha2 = "0.10"
ureq = "2.12"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
icns = { version = "0.4", default-features = false, features = ["pngio"] }
# For writing a Windows game's icon and version into its programs. BSD-2-Clause.
editpe = { version = "0.2.4", default-features = false, features = ["std"] }
# For packing a Windows game into one program (packaging/windows_pack.rs). MIT.
ruzstd = "0.8"

[target.'cfg(windows)'.dependencies]
# For the installer steps we run in the builder (src/installation.rs): the
# person's Path in the registry and the games' sandboxes. Also for the local
# time in a zip's date field (packaging/archive.rs).
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security_Isolation",
    "Win32_System_Registry",
    "Win32_System_Time",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
# For the local time in a zip's date field (packaging/archive.rs).
libc = "0.2"

[build-dependencies]
serde_json.workspace = true
# For the RetroArch patch formats in the engine (build.rs). MIT or Apache-2.0.
cc = "1.2"
# For giving the command line the builder's icon and version on Windows
# (build.rs), the same crate as in Tauri's build step for the builder. MIT.
tauri-winres = "0.3"

[dev-dependencies]
libc = "0.2.189"
rominabox-scratch = { path = "../rominabox-scratch" }
